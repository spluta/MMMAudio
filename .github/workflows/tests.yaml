name: Mojo Unit Tests

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: brew installs
        run: |
          brew install portaudio
          brew install pixi

      - name: run 'pixi install'
        run: |
          pixi install

      - name: Download onset validation audio
        run: |
          mkdir -p "$RUNNER_TEMP/audio"
          curl -fsSL \
            -o "$RUNNER_TEMP/audio/Nicol-LoopE-M.wav" \
            "https://raw.githubusercontent.com/flucoma/flucoma-core/main/Resources/AudioFiles/Nicol-LoopE-M.wav"

      - name: Export onset validation audio path
        run: |
          echo "ONSET_DETECTION_AUDIO_PATH=$RUNNER_TEMP/audio/Nicol-LoopE-M.wav" >> "$GITHUB_ENV"

      - name: Run Tests
        id: run-tests
        run: |
          pixi run test_all